<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140">
  <defs>
    <!-- Pipeline Gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="20%" stop-color="#FF6B00" />
      <stop offset="40%" stop-color="#FFCC00" />
      <stop offset="60%" stop-color="#22C55E" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    
    <!-- Outer Glow -->
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .background {
      fill: #0F0F12;
      stroke: rgba(255,255,255,0.05);
      stroke-width: 1;
    }
    .wave-bg {
      stroke: rgba(255,255,255,0.06);
      stroke-width: 2.5;
      fill: none;
    }
    .wave-flow {
      stroke: url(#pipeGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 20 15;
      animation: dashFlow 10s linear infinite;
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .sub-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 8px;
      font-weight: 500;
      text-anchor: middle;
      fill: #8E8E93;
      letter-spacing: 0.5px;
    }
    .pulse-ring {
      transform-origin: center;
      animation: pulseNode 3s ease-in-out infinite;
    }
    
    @keyframes dashFlow {
      to { stroke-dashoffset: -350; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5px; opacity: 0.3; }
      50% { r: 9px; opacity: 0.75; }
    }
  </style>

  <!-- Card Background -->
  <rect class="background" x="2" y="2" width="796" height="136" rx="8" />

  <!-- Base Curved Path -->
  <path class="wave-bg" d="M 70 70 C 136 30, 136 110, 202 70 C 268 30, 268 110, 334 70 C 400 30, 400 110, 466 70 C 532 30, 532 110, 598 70 C 664 30, 664 110, 730 70" />
  
  <!-- Wavy flowing spectrum curve -->
  <path class="wave-flow" filter="url(#glow)" d="M 70 70 C 136 30, 136 110, 202 70 C 268 30, 268 110, 334 70 C 400 30, 400 110, 466 70 C 532 30, 532 110, 598 70 C 664 30, 664 110, 730 70" />

  <!-- Nodes & Labels -->
  <!-- USER -->
  <g transform="translate(0, 0)">
    <circle class="pulse-ring" cx="70" cy="70" r="7" fill="#FF3B30" />
    <circle cx="70" cy="70" r="4.5" fill="#FF3B30" />
    <text class="label" x="70" y="105">USER</text>
    <text class="sub-label" x="70" y="118">WHO IS IT FOR?</text>
  </g>

  <!-- PROBLEM -->
  <g transform="translate(0, 0)">
    <circle class="pulse-ring" cx="202" cy="70" r="7" fill="#FF6B00" style="animation-delay: 0.5s;" />
    <circle cx="202" cy="70" r="4.5" fill="#FF6B00" />
    <text class="label" x="202" y="105">PROBLEM</text>
    <text class="sub-label" x="202" y="118">WHY EXIST?</text>
  </g>

  <!-- INSIGHT -->
  <g transform="translate(0, 0)">
    <circle class="pulse-ring" cx="334" cy="70" r="7" fill="#FFCC00" style="animation-delay: 1s;" />
    <circle cx="334" cy="70" r="4.5" fill="#FFCC00" />
    <text class="label" x="334" y="105">INSIGHT</text>
    <text class="sub-label" x="334" y="118">WHAT SOLVES IT?</text>
  </g>

  <!-- SOLUTION -->
  <g transform="translate(0, 0)">
    <circle class="pulse-ring" cx="466" cy="70" r="7" fill="#22C55E" style="animation-delay: 1.5s;" />
    <circle cx="466" cy="70" r="4.5" fill="#22C55E" />
    <text class="label" x="466" y="105">SOLUTION</text>
    <text class="sub-label" x="466" y="118">WHAT WE BUILD</text>
  </g>

  <!-- VALIDATION -->
  <g transform="translate(0, 0)">
    <circle class="pulse-ring" cx="598" cy="70" r="7" fill="#2563EB" style="animation-delay: 2s;" />
    <circle cx="598" cy="70" r="4.5" fill="#2563EB" />
    <text class="label" x="598" y="105">VALIDATION</text>
    <text class="sub-label" x="598" y="118">DOES IT WORK?</text>
  </g>

  <!-- IMPACT -->
  <g transform="translate(0, 0)">
    <circle class="pulse-ring" cx="730" cy="70" r="7" fill="#A855F7" style="animation-delay: 2.5s;" />
    <circle cx="730" cy="70" r="4.5" fill="#A855F7" />
    <text class="label" x="730" y="105">IMPACT</text>
    <text class="sub-label" x="730" y="118">MEASURE SUCCESS</text>
  </g>
</svg>
