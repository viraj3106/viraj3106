<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="25%" stop-color="#FFCC00" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="75%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>
  <style>
    .ring {
      transform-origin: center;
      animation: spin 4s linear infinite;
    }
    .dot {
      transform-origin: center;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>
  <circle class="ring" cx="16" cy="16" r="10" fill="none" stroke="url(#rainbowGrad)" stroke-width="2" stroke-dasharray="8 4 6 4" />
  <circle class="dot" cx="16" cy="16" r="4.5" fill="#2563EB" />
</svg>
